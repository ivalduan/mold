[workspace]
resolver = "3"
members = [
    # Domain core: no GPUI, no async
    "crates/mol",
    "crates/chem",
    "crates/geom",
    "crates/render",
    # Orchestration: no GPUI, testable headless
    "crates/graph",
    "crates/nodes",
    "crates/jobs",
    "crates/recipe",
    "crates/cli",
    # UI: the only crates allowed to depend on GPUI / GPUI Kit
    "crates/app",
    "crates/ui-graph",
    "crates/ui-viewport",
    "crates/ui-panels",
    # Workers written in Rust (Python workers live in workers/ but are not crates)
    "workers/mock-cofold",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ivalduan/mold"  # may move to a Mold-specific org
publish = false

# Add third-party crates here first, then use `dep = { workspace = true }` in a member.
# Keep each addition in its own small commit: this table is the main merge hotspot
# between worktrees. Record the licence in THIRD_PARTY.md in the same commit.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
# mol: PDB/mmCIF I/O. Only "compression" (reads .gz; pdbtbx 0.12 fails to build without it).
pdbtbx = { version = "0.12.0", default-features = false, features = ["compression"] }
# mol: pose table. Minimal features. Pinned below 0.54: polars-core 0.54+ pulls tokio
# (rt-multi-thread) unconditionally, and mol must not link an async runtime.
polars = { version = "0.53.0", default-features = false }

# UI band only (ADR-0002): never in a crate below the UI band. GPUI Kit pins its GPUI
# snapshot; the gpui-fast feature selects GPUI Fast (window composition, native
# surfaces). Members add layers (e.g. "component") themselves.
gpui-kit = { version = "=0.11.0", default-features = false, features = ["gpui-fast"] }
# Pinned exactly although gpui-kit already requires it: `platform_handle()` is an
# untyped `Any`, so a gpui-fast bump can break the viewport at run time, not compile
# time (ADR-0002). Bump only together with a re-run of the viewport spike.
gpui-fast = { version = "=0.1.19", default-features = false }
# render, ui-viewport. Exactly the wgpu gpui-fast-wgpu 0.1.19 pins for GPUI's Linux
# renderer, so the tree holds one wgpu.
wgpu = "=30.0.1"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
# ui-viewport, Windows only: must resolve to the windows-core gpui-fast-windows uses,
# or the native-surface downcast fails at run time.
windows = { version = "0.62", features = ["Win32_Graphics_DirectComposition"] }

# Internal crates
mold-mol = { path = "crates/mol" }
mold-chem = { path = "crates/chem" }
mold-geom = { path = "crates/geom" }
mold-render = { path = "crates/render" }
mold-graph = { path = "crates/graph" }
mold-nodes = { path = "crates/nodes" }
mold-jobs = { path = "crates/jobs" }
mold-recipe = { path = "crates/recipe" }
mold-ui-graph = { path = "crates/ui-graph" }
mold-ui-viewport = { path = "crates/ui-viewport" }
mold-ui-panels = { path = "crates/ui-panels" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.cargo]
# The internal path dependencies encode the layering from docs/architecture.md before
# any crate uses them. Remove this allow once the skeleton crates have real code.
unused_dependencies = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
# Dependencies (wgpu, polars, pdbtbx) are slow unoptimized; our own code stays debuggable.
opt-level = 2

# CI: compile fast rather than run fast, the opposite trade-off from `dev`.
# Optimizing dependencies is what makes a cold Windows run expensive, because it
# optimizes the whole GPUI tree (19 crates) to run tests that never open a
# window. Debug info is trimmed and incremental is off: every runner starts
# fresh, so incremental only bloats the cache.
# A performance budget from CLAUDE.md must NOT be measured on this profile —
# use `--release`.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 0
