[package]
name = "mold-mock-cofold"
description = "Mock co-fold worker: deterministic seeded poses and failure injection, no GPU, no Python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mock-cofold"
path = "src/main.rs"

# The SSH executor's test doubles (src/double.rs): `ssh`- and `scp`-shaped stand-ins,
# so staging, the remote wrapper and the remote process-group kill are testable with
# no network and no sshd. They live in this package because only its own integration
# tests see `CARGO_BIN_EXE_*` for the worker *and* the doubles at once.
[[bin]]
name = "mock-ssh"
path = "src/bin/mock-ssh.rs"

[[bin]]
name = "mock-scp"
path = "src/bin/mock-scp.rs"

[dependencies]
mold-jobs.workspace = true
mold-mol.workspace = true
serde_json.workspace = true

# The local executor's process tests live here: `CARGO_BIN_EXE_mock-cofold` is only
# visible to this package's integration tests (see crates/jobs/CLAUDE.md).
[dev-dependencies]
mold-graph.workspace = true

[lints]
workspace = true
