[package]
name = "mold-ui-panels"
description = "Pose table, affinity-vs-confidence scatter, 2D SAR; subscribers of the selection bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The bus and the table view model depend on these alone and build headless everywhere.
mold-mol.workspace = true
# No extra features: the view model reads typed columns and sorts/filters an index
# permutation itself (no polars sort/lazy features, no tokio; see CLAUDE.md).
polars.workspace = true

# The GPUI views, like ui-graph and ui-viewport, are built on Windows only for now
# (ADR-0002/0003): Linux CI builds and tests the headless core with no system
# packages. "component" = GPUI Kit's component layer (the virtualized table).
[target.'cfg(windows)'.dependencies]
gpui-kit = { workspace = true, features = ["component"] }
gpui-fast.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "table"
harness = false

[lints]
workspace = true
