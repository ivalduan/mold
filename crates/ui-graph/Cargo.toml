[package]
name = "mold-ui-graph"
description = "Node canvas: typed ports, drag-time type checking, custom node renderers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The canvas core (`canvas`) depends on this alone and builds headless everywhere.
mold-graph.workspace = true

# The GPUI view, like ui-viewport, is built on Windows only for now (ADR-0002/0003):
# Linux CI builds and tests the headless core with no system packages.
[target.'cfg(windows)'.dependencies]
gpui-kit.workspace = true
gpui-fast.workspace = true

[lints]
workspace = true
