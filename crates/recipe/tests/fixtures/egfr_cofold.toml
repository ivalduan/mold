# EGFR: co-fold the 4-anilinoquinazoline series against 1M17 and gate the poses.
# Hand-written, in pipeline order (the canonical form sorts nodes by id instead):
#
#   receptor ─► msa ──► cofold ─► gate      (receptor also feeds cofold and gate)
#   ligands ──► prep ───┘

[recipe]
format = 1
executor = "local"            # a key from ~/.mold/executors.toml, never a host

[node.receptor]
kind = "load_structure"

[node.receptor.params]
path = "fixtures/egfr/receptor.cif"
chains = ["A"]

[node.msa]
kind = "msa_query"            # sends the sequence off-box: the UI says so first
inputs = { structure = "receptor.structure" }

[node.msa.params]
provider = "colabfold-public"

[node.ligands]
kind = "load_ligands"

[node.ligands.params]
path = "fixtures/egfr/ligands.smi"

[node.prep]
kind = "prepare_ligands"
inputs = { ligands = "ligands.ligands" }

[node.prep.params]
ph = 7.4

[node.cofold]
kind = "cofold"
executor = "gpu-box"          # override: this node runs where the GPU is
inputs = { ligands = "prep.ligands", receptor = "receptor.structure", msa = "msa.msa" }

[node.cofold.params]
model = "boltz-2"
samples = 5
seed = 42

[node.gate]
kind = "pose_gate"
inputs = { poses = "cofold.poses", receptor = "receptor.structure" }

[node.gate.params]
max_clashes = 2
min_contacts = 4
pocket_radius = 8.0

# Canvas positions: optional, ignored by headless replay.
[layout.positions]
receptor = { x = 0, y = 0 }
msa = { x = 280, y = -120 }
ligands = { x = 0, y = 220 }
prep = { x = 280, y = 220 }
cofold = { x = 560, y = 60 }
gate = { x = 840, y = 60.5 }

# What answered last time. Written by the run, not by hand; shown here as data.
[provenance.msa]
provider = "colabfold-public"
endpoint = "https://api.colabfold.com"

[provenance.cofold]
worker = "mock-cofold"
worker_version = "0.1.0"
model_version = "boltz-2.0.3"
