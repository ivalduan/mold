[package]
name = "mold-ui-viewport"
description = "GPUI element hosting the wgpu viewport; the ViewportBackend seam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
mold-mol.workspace = true
mold-render.workspace = true
# The seam hands `mold-render` a `wgpu::Surface`; wgpu builds headless everywhere.
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true

# Only the Windows backend exists yet (ADR-0003), so GPUI is only built where it can
# be used. macOS/Linux backends add their own target tables.
[target.'cfg(windows)'.dependencies]
gpui-kit.workspace = true
gpui-fast.workspace = true
windows.workspace = true

[target.'cfg(windows)'.dev-dependencies]
# The spike example uses the Kit's popup menu, the component the app will use.
gpui-kit = { workspace = true, features = ["component"] }

[lints]
workspace = true
